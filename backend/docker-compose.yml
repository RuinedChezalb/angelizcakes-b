services:
  app:
    build:
      context: ../..
      dockerfile: Angeliz_Cakes/backend/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8080}
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      SESSION_KEY: ${SESSION_KEY:?Set SESSION_KEY in .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PAYMONGO_MODE: ${PAYMONGO_MODE:-test}
      PAYMONGO_TEST_PUBLIC_KEY: ${PAYMONGO_TEST_PUBLIC_KEY:-}
      PAYMONGO_TEST_SECRET_KEY: ${PAYMONGO_TEST_SECRET_KEY:-}
      PAYMONGO_TEST_WEBHOOK_SECRET: ${PAYMONGO_TEST_WEBHOOK_SECRET:-}
      PAYMONGO_LIVE_PUBLIC_KEY: ${PAYMONGO_LIVE_PUBLIC_KEY:-}
      PAYMONGO_LIVE_SECRET_KEY: ${PAYMONGO_LIVE_SECRET_KEY:-}
      PAYMONGO_LIVE_WEBHOOK_SECRET: ${PAYMONGO_LIVE_WEBHOOK_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; port = os.environ['PORT']; request = urllib.request.Request(f'http://127.0.0.1:{port}/healthz', headers={'Host': os.environ['DOMAIN']}); urllib.request.urlopen(request, timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      APP_PORT: ${PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
