<main id="storefrontLogin" class="auth-page-content login-layout">
  <!-- Decorative Floating Background Illustrations -->
  <div class="auth-bg-decorations" aria-hidden="true">
    <img src="assets/img1.png" alt="" class="bgIMG1">
    <img src="assets/img2.png" alt="" class="bgIMG2">
    <img src="assets/img3.png" alt="" class="bgIMG3">
  </div>

  <div class="login-container">
    <div class="auth-top-actions">
      <a class="auth-back-link" href="#home" data-storefront-back aria-label="Back to previous page">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <span>Back</span>
      </a>
    </div>

    <h1 class="logIn-tag">SIGN IN</h1>

    <form id="authLoginForm" novalidate>
      <div class="form-field">
        <label class="label" for="loginUsername">Email or Username</label>
        <input id="loginUsername" type="text" autocomplete="username" placeholder="Email address or username" class="email-input" required autofocus>
      </div>

      <div class="form-field">
        <label class="label" for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" class="password-input" required>
      </div>

      <p id="loginAuthStatus" role="alert" aria-live="polite"></p>

      <button class="login-button" type="submit">LOG IN</button>
    </form>

    <div class="links-container">
      <a class="forgot-password" href="#" data-auth-action="forgot-password">Forgot Password?</a>
      <a class="register-account" href="#register" data-switch-auth="register">Register</a>
    </div>

    <div class="other-options-divider">
      <p class="other-Option">OR CONTINUE WITH</p>
    </div>

    <div class="icons-container">
      <a class="social-icon-btn" href="#" aria-label="Continue with Google" data-auth-action="google">
        <img src="assets/google.png" alt="Google" class="social-icon">
      </a>
    </div>

    <p class="social-login-note">Continue with Google to sign in or create a password-free customer account. You will return to the homepage signed in.</p>
  </div>
</main>
