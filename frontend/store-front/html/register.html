<main id="storefrontRegister" class="auth-page-content register-layout">
  <!-- Decorative Floating Background Illustrations (Mirrored for Register) -->
  <div class="auth-bg-decorations" aria-hidden="true">
    <img src="assets/img1.png" alt="" class="bgIMG1">
    <img src="assets/img2.png" alt="" class="bgIMG2">
    <img src="assets/img3.png" alt="" class="bgIMG3">
  </div>

  <div class="login-container">
    <div class="auth-top-actions">
      <a class="auth-back-link" href="#home" data-storefront-back aria-label="Back to previous page">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <span>Back</span>
      </a>
    </div>

    <h1 class="logIn-tag">REGISTER</h1>

    <form id="authRegisterForm" novalidate>
      <div class="form-field">
        <label class="label" for="regFullName">Full Name</label>
        <input id="regFullName" type="text" autocomplete="name" placeholder="Your full name" class="email-input" required autofocus>
      </div>

      <div class="form-field">
        <label class="label" for="regUsername">Email Address</label>
        <input id="regUsername" type="email" autocomplete="username" placeholder="name@example.com" class="email-input" required>
      </div>

      <div class="password-fields">
        <div class="password-field">
          <label class="label" for="regPassword">Password (12+ chars)</label>
          <input id="regPassword" type="password" autocomplete="new-password" placeholder="Enter password" class="password-input" minlength="12" required>
        </div>
        <div class="password-field">
          <label class="label" for="regConfirmPassword">Confirm Password</label>
          <input id="regConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" class="password-input" minlength="12" required>
        </div>
      </div>

      <label class="terms-row" for="regTermsAccepted">
        <input id="regTermsAccepted" type="checkbox" required>
        <span>I agree to the <a href="#" data-auth-action="terms">Terms of Service</a> and acknowledge the <a href="#" data-auth-action="privacy">Privacy Policy</a>.</span>
      </label>

      <p id="regAuthStatus" role="alert" aria-live="polite"></p>

      <button class="login-button" type="submit">REGISTER</button>
    </form>

    <p class="account-prompt">Already have an account? <a class="register-account" href="#login" data-switch-auth="login">Log in here.</a></p>

    <div class="other-options-divider">
      <p class="other-Option">OR SIGN UP WITH</p>
    </div>

    <div class="icons-container">
      <a class="social-icon-btn" href="#" aria-label="Sign up with Google" data-auth-action="google">
        <img src="assets/google.png" alt="Google" class="social-icon">
      </a>
    </div>

    <p class="social-login-note">Continue with Google to create your password-free customer account. Google provides your name and verified email; no separate email or password entry is needed.</p>
  </div>
</main>
