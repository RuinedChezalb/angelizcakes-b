<main id="storefrontCustomizationWizard" class="customization-wizard-page" aria-labelledby="customizationWizardTitle">
  <div class="customization-wizard-shell">
    <div class="customization-wizard-toolbar">
      <a class="customization-wizard-back" href="#customize" data-storefront-back>
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <span>Back to customization</span>
      </a>
    </div>

    <header class="customization-wizard-header">
      <h1 id="customizationWizardTitle">Build your custom cake</h1>
    </header>

    <div class="customization-wizard-progress">
      <ol class="customization-wizard-stepper" data-wizard-stepper aria-label="Customization steps"></ol>
    </div>

    <section class="customization-wizard-stage" data-wizard-content aria-live="polite"></section>
    <section class="customization-wizard-review" data-wizard-summary aria-live="polite" hidden></section>
  </div>
</main>
