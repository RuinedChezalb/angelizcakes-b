<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdf0f3">
  <title>Branch Admin · Angeliz Cakes</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!--
    DATABASE INTEGRATION INVENTORY
    Current state: branch pages share a local database (shared/local-db.js, browser localStorage,
    same origin as the storefront and owner admin). Connected locally: storefront and branch orders,
    customers, inquiries and replies, stock requests, POS transactions, and inventory batches.
    Sales reports, daily reports, and shift handovers still use sample data. Replace the local
    database helpers with branch-scoped APIs when the database is connected.

    READ FROM THE DATABASE (GET)
    • Dashboard: branch sales, orders, bookings, feedback, customer activity, and stock alerts.
    • Order Management: assigned orders, custom-cake inquiries, customer details, and fulfillment status.
    • Customer Records: branch customer profiles, order counts, and purchase summaries.
    • Branch Inventory: current batches, stock levels, expiry dates, deliveries, and requests.
    • POS Terminal: sellable catalog, customer lookup, batch deductions, and transaction history.
    • Sales and Financial Reports, Daily Branch Report, and Staff Shift Management currently use sample data.
    • Communications: storefront inquiries, reply history, and inbox/archive state.
    • Customer Support is a placeholder with static, empty content.

    CREATE (POST)
    • Record custom-cake inquiries, completed POS transactions, stock requests, and deliveries.
    • Submit a product update suggestion for owner review.
    • Save one reply to a storefront inquiry and archive it.
    • Daily reports and shift handovers are frontend-only and are not persisted.

    UPDATE (PATCH/PUT)
    • Change an order's fulfillment status, add delivery batches, and deduct POS sales by earliest expiry.
    • Track stock-request status and owner review of product update suggestions.
    • Update a storefront inquiry's reply and archived state.

    DELETE (DELETE)
    • No delete action is exposed for branch orders, customers, products, or inventory records.
  -->
  <div id="ownerAdminApp" class="sidebar-expanded">
    <header id="ownerAdminHeader" class="owner-admin-header">
      <div class="owner-admin-header-left">
        <button class="ac-toggle" id="acToggle" type="button"
                aria-controls="ac-sidebar" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <time id="ownerAdminCurrentDate" class="owner-admin-date"></time>
      </div>
      <div class="owner-admin-header-right">
        <button class="owner-admin-icon-button" type="button" aria-label="Notifications"
                aria-describedby="branchAdminNotificationTooltip" data-header-tooltip>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span class="owner-admin-tooltip" id="branchAdminNotificationTooltip" role="tooltip" hidden>No new notifications</span>
        </button>
        <button class="owner-admin-icon-button" id="branchAdminCommunicationButton" type="button"
                aria-label="Open customer communications" aria-controls="ownerAdminViewMount"
                aria-describedby="branchAdminCommunicationTooltip" data-header-tooltip>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
          <span class="owner-admin-tooltip" id="branchAdminCommunicationTooltip" role="tooltip" hidden>No new messages</span>
        </button>
        <div class="owner-admin-profile" aria-label="Branch manager profile">
          <span class="owner-admin-profile-name" title="Angeliz Cakes">Angeliz Cakes</span>
          <span class="owner-admin-profile-role">Branch Manager</span>
        </div>
      </div>
    </header>

    <button id="acSidebarBackdrop" class="ac-sidebar-backdrop" type="button"
            aria-label="Close navigation menu" hidden></button>

    <div id="ownerAdminSidebarMount" aria-label="Branch navigation">
      <aside id="ac-sidebar" class="ac-sidebar pinned">
        <div class="ac-profile-header">
          <div class="ac-avatar-wrap">
            <div class="ac-avatar-inner">
              <div class="ac-avatar-initials">MS</div>
            </div>
          </div>
          <div class="ac-profile-text">
            <h2 class="ac-name">Maria Santos</h2>
            <span class="ac-role">Branch Manager</span>
          </div>
        </div>

        <nav class="ac-nav" aria-label="Branch Admin pages">
          <div class="ac-nav-label">Overview</div>
          <a href="#dashboard" class="ac-link" data-admin-view="dashboard">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span class="ac-label">Dashboard</span>
          </a>

          <div class="ac-nav-label">Operations</div>
          <a href="#order-management" class="ac-link" data-admin-view="order-management">
            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h6"/></svg>
            <span class="ac-label">Order Management</span>
          </a>
          <a href="#customer-records" class="ac-link" data-admin-view="customer-records">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/></svg>
            <span class="ac-label">Customer Records</span>
          </a>
          <a href="#branch-inventory" class="ac-link" data-admin-view="branch-inventory">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
            <span class="ac-label">Branch Inventory</span>
          </a>
          <a href="#pos-terminal" class="ac-link" data-admin-view="pos-terminal">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h12"/></svg>
            <span class="ac-label">POS Terminal</span>
          </a>

          <div class="ac-nav-label">Insights</div>
          <a href="#sales-financial-reports" class="ac-link" data-admin-view="sales-financial-reports">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
            <span class="ac-label">Sales &amp; Financial Reports</span>
          </a>

          <div class="ac-nav-label">Administration</div>
          <a href="#staff-shift-management" class="ac-link" data-admin-view="staff-shift-management">
            <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 4h3v2a3 3 0 0 1-3 3M7 4H4v2a3 3 0 0 0 3 3"/></svg>
            <span class="ac-label">Staff Shift Management</span>
          </a>
          <a href="#support-center" class="ac-link" data-admin-view="support-center">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/></svg>
            <span class="ac-label">Customer Support</span>
          </a>
          <button class="ac-link ac-logout" id="branchAdminLogoutButton" type="button">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            <span class="ac-label">Logout</span>
          </button>
        </nav>

        <div class="ac-quick">
          <button class="ac-quick-btn" type="button" data-action="custom-cake">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span class="ac-label">Create Cake Order</span>
          </button>
          <button class="ac-quick-btn" type="button" data-action="request-stock">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4zM12 22V12"/></svg>
            <span class="ac-label">Request Stock</span>
          </button>
          <button class="ac-quick-btn" type="button" data-action="submit-report">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 13h6M9 17h6"/></svg>
            <span class="ac-label">Submit Report</span>
          </button>
        </div>
      </aside>
      <div class="ac-toast" id="acToast" role="status" aria-live="polite"></div>
    </div>

    <div id="ownerAdminViewMount" aria-live="polite" aria-busy="true"></div>
    <p id="ownerAdminStatus" role="status" aria-live="polite"></p>
  </div>
  <script src="../shared/local-db.js"></script>
  <script src="js/branch-inventory-store.js"></script>
  <script src="branch-admin-ajax.js"></script>
</body>
</html>
